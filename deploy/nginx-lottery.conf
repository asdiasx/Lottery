# Versão em produção (inclui blocos do certbot e limites da ADR 0019; requer infraestrutura/nginx/00-limites.conf e snippets/proxy-app.conf).
# /etc/nginx/sites-available/lottery  (o certbot acrescenta o bloco HTTPS)
server {
    server_name lottery.seek4k.com.br;
    limit_conn conexoes 20;

    location / {
        limit_req zone=geral burst=60 nodelay;
        proxy_pass http://127.0.0.1:3002;
        include snippets/proxy-app.conf;
        proxy_read_timeout 120s;
    }
    location = /download {
        limit_req zone=pesado burst=3 nodelay;   # gera PDF com Chromium: caro
        proxy_pass http://127.0.0.1:3002;
        include snippets/proxy-app.conf;
        proxy_read_timeout 120s;
    }
    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lottery.seek4k.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lottery.seek4k.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = lottery.seek4k.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name lottery.seek4k.com.br;
    return 404; # managed by Certbot


}